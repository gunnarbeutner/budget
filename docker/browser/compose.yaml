# Local run of the browser sidecar, for trying remote web logins against an app started with `dotnet run`:
#
#   export SELKIES_MASTER_TOKEN=$(openssl rand -hex 32)
#   docker compose -f docker/browser/compose.yaml up -d --build
#   Browser__Remote__LauncherUrl=http://127.0.0.1:9300 Browser__Remote__StreamUrl=http://127.0.0.1:8090 \
#     Browser__Remote__Token=$SELKIES_MASTER_TOKEN dotnet run --project src/OpenBudget
#
# Ports are published on loopback only. Production runs it next to the app without published ports (deploy/).
name: openbudget-browser
services:
  browser:
    build: .
    user: "1000:1000"
    security_opt:
      - seccomp=./seccomp_profile.json
    shm_size: 1gb
    environment:
      SELKIES_MASTER_TOKEN: ${SELKIES_MASTER_TOKEN:?export SELKIES_MASTER_TOKEN first (openssl rand -hex 32)}
      SELKIES_SUBFOLDER: /weblogin/desktop/
      SELKIES_ENABLE_HTTPS: "false"
      SELKIES_ENABLE_BASIC_AUTH: "false"
      SELKIES_PUBLIC: "true"
      SELKIES_DESKTOP: "false"
      SELKIES_WM: "true"
      SELKIES_WAYLAND: "false"
      SELKIES_ENABLE_DUAL_MODE: "false"
      SELKIES_ENABLE_COLLAB: "true"
      SELKIES_ENABLE_SHARED: "false"
      SELKIES_ENABLE_SHARING: "false"
      SELKIES_COMMAND_ENABLED: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_PRINTING_ENABLED: "false"
      SELKIES_UI_SIDEBAR_SHOW_FILES: "false"
      SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
      SELKIES_ENABLE_CLIPBOARD: "in"
      SELKIES_ENABLE_BINARY_CLIPBOARD: "false"
      SELKIES_AUDIO_ENABLED: "false"
      SELKIES_FRAMERATE: "30,8-60"
      SELKIES_MANUAL_WIDTH: "1280"
      SELKIES_MANUAL_HEIGHT: "720"
      SELKIES_SECOND_SCREEN: "false"
      SELKIES_ENCODER: h264enc,jpeg
      SELKIES_BACKPRESSURE_QUEUE_SIZE: "2"
      SELKIES_CONGESTION_CONTROL: "true"
      SELKIES_ALLOWED_ORIGINS: http://localhost:5000,http://127.0.0.1:5000,https://localhost:5001
      BROWSER_MAX: "6"
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:9300:9300"
      - "127.0.0.1:9400-9405:9400-9405"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/weblogin/desktop/api/health >/dev/null && curl -fsS http://localhost:9300/health >/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

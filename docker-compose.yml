# Example deployment for OpenBudget.
#
# Builds the image from this checkout. To run a prebuilt image instead, replace `build: .` with
# `image: <registry>/<owner>/budget:<tag>` (the GitHub workflow publishes
# ghcr.io/<owner>/budget:latest and :sha-<commit>). Updating is then
# `docker compose pull && docker compose up -d`.
#
# Before the first start:
#   echo "OPENBUDGET_UPLOAD_TOKEN=$(openssl rand -hex 32)" > .env
#   (an existing .env with the old MONEYMONEY_DB_UPLOAD_TOKEN keeps working; rename it when
#   convenient — the server logs a deprecation warning while only the old name is set)
#
# Bootstrap data: copy budgets.db into ./data/ before first start, or POST an importer snapshot
# (see README, "Importers") after start.
#
# First start: no users exist yet and every page shows only a setup message. Create the first
# admin (it also takes over a source of the same name and that source's projects):
#   docker exec openbudget dotnet OpenBudget.dll users add <username> --admin
# See README, "Users and sharing". Keep ./data on a persistent volume: it holds the database and
# the data-protection keys (data/keys) that keep logins valid across redeploys.
#
# TLS: the app speaks plain HTTP on port 8080. Put a TLS-terminating reverse proxy (nginx / Caddy /
# Traefik / Apache) in front; it must send X-Forwarded-Proto and X-Forwarded-Host.

services:
  app:
    build: .
    container_name: openbudget
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      # Either variable works; the second is the deprecated pre-rename name, still honoured so an
      # existing .env keeps working. The app returns 503 on uploads when neither is set.
      OPENBUDGET_UPLOAD_TOKEN: ${OPENBUDGET_UPLOAD_TOKEN:-}
      MONEYMONEY_DB_UPLOAD_TOKEN: ${MONEYMONEY_DB_UPLOAD_TOKEN:-}
      # Required for bank logins (see README, "Bank connectors"): `openssl rand -base64 32`. Not stored in ./data.
      OPENBUDGET_SECRETS_KEY: ${OPENBUDGET_SECRETS_KEY:-}
      # OPENBUDGET_ENABLE_FAKE_BANK: "true"   # offers a made-up bank for trying the connector flow
      # Optional: pin the passkey relying-party id (defaults to the request host).
      # OPENBUDGET_RP_ID: budget.example.org

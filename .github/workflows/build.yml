name: Build and push container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/OpenBudget.Tests/OpenBudget.Tests.csproj

      - name: Run tests
        run: dotnet test tests/OpenBudget.Tests/OpenBudget.Tests.csproj --no-restore --verbosity minimal

  e2e:
    # Browser end-to-end tests. Kept in their own job (and out of budget.slnx) because they
    # boot the app on Kestrel and drive Chromium — slower and with heavier dependencies than
    # the unit run.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build E2E test project
        run: dotnet build tests/OpenBudget.E2E.Tests/OpenBudget.E2E.Tests.csproj --verbosity minimal

      - name: Install Playwright browser
        # Bundled script generated into the build output; --with-deps pulls the Chromium
        # system libraries the runner image doesn't ship with.
        run: pwsh tests/OpenBudget.E2E.Tests/bin/Debug/net11.0/playwright.ps1 install --with-deps chromium

      - name: Allow Chromium's sandbox
        # Ubuntu's AppArmor blocks the unprivileged user namespaces the server-side login browser's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run E2E tests
        # Two fixture workers for the runner's two cores; the default six starve the app hosts and browsers.
        run: dotnet test tests/OpenBudget.E2E.Tests/OpenBudget.E2E.Tests.csproj --no-build --verbosity minimal -- NUnit.NumberOfTestWorkers=2

  lint:
    # Static analysis gate. The Roslyn/Sonar/Meziantou analyzers themselves run as part of the
    # `test`/`e2e` builds (TreatWarningsAsErrors fails those on any violation); this job adds the
    # formatting check that a plain build doesn't enforce, plus workflow-YAML linting.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore budget.slnx
          dotnet restore tests/OpenBudget.E2E.Tests/OpenBudget.E2E.Tests.csproj

      - name: Verify formatting (dotnet format)
        # Fails if any file isn't formatted per .editorconfig, or if a code-style (IDExxxx) rule
        # such as "remove unnecessary usings" would change the tree. The E2E project is verified
        # separately because it's intentionally kept out of budget.slnx.
        run: |
          dotnet format whitespace budget.slnx --verify-no-changes --no-restore
          dotnet format style budget.slnx --verify-no-changes --no-restore
          dotnet format whitespace tests/OpenBudget.E2E.Tests/OpenBudget.E2E.Tests.csproj --verify-no-changes --no-restore
          dotnet format style tests/OpenBudget.E2E.Tests/OpenBudget.E2E.Tests.csproj --verify-no-changes --no-restore

      - name: Lint GitHub Actions workflows (actionlint)
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  build-and-push:
    # Only push the image when the unit/E2E suites and the lint gate all pass. PR runs hit
    # `test`/`e2e`/`lint` only — they don't have packages:write and the build step would 401
    # against GHCR anyway.
    needs: [test, e2e, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag every push as the commit SHA so we can pin / roll back, and tag main
      # as `latest` for deployments that track the newest build.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The pushed image is an index (image + provenance attestation); GHCR reads the description
          # from the index's annotations, so annotate the index as well as the manifest.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/budget
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          # GHCR shows the description on the package page; set it here so the repository's own
          # description (which the action would copy) can't blank it.
          labels: |
            org.opencontainers.image.title=OpenBudget
            org.opencontainers.image.description=Self-hosted personal finance app with bank sync, budgets and cashflow projections.
          annotations: |
            org.opencontainers.image.title=OpenBudget
            org.opencontainers.image.description=Self-hosted personal finance app with bank sync, budgets and cashflow projections.

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

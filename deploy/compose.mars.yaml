# REVIEW INPUT for beutner-infra/files/mars/docker/budget/compose.yaml: merge, do not replace.
# Adds the browser sidecar next to the existing app service; see docs/browser-sidecar.md.
# Image selection is generated by the fleet's compose_deployment role; no host-side builds.
services:
  app:
    # existing service: keep everything, add these keys
    env_file:
      - path: ./secrets/browser.env   # Browser__Remote__Token=<same value as SELKIES_MASTER_TOKEN>
        format: raw
    environment:
      Browser__Remote__LauncherUrl: http://browser:9300
      Browser__Remote__StreamUrl: http://browser:8080
    # depends_on is optional: without a healthy sidecar web logins fail with a message; nothing else is affected.

  browser:
    image: git.beutner.name/gunnar/budget-browser:managed-by-ansible
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    user: "1000:1000"
    security_opt: [seccomp=./seccomp_profile.json]
    shm_size: 1gb
    env_file:
      - path: ./secrets/browser-sidecar.env   # SELKIES_MASTER_TOKEN=<openssl rand -hex 32>
        format: raw
    environment:
      SELKIES_SUBFOLDER: /weblogin/desktop/
      SELKIES_PUBLIC: "true"
      SELKIES_DESKTOP: "false"
      SELKIES_WM: "true"
      SELKIES_WAYLAND: "false"
      SELKIES_ENABLE_HTTPS: "false"
      SELKIES_ENABLE_BASIC_AUTH: "false"
      SELKIES_ENABLE_COLLAB: "true"
      SELKIES_ENABLE_SHARED: "false"
      SELKIES_ENABLE_SHARING: "false"
      SELKIES_ENABLE_DUAL_MODE: "false"
      SELKIES_COMMAND_ENABLED: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_PRINTING_ENABLED: "false"
      SELKIES_UI_SIDEBAR_SHOW_FILES: "false"
      SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
      SELKIES_ENABLE_CLIPBOARD: "in"
      SELKIES_ENABLE_BINARY_CLIPBOARD: "false"
      SELKIES_AUDIO_ENABLED: "false"
      SELKIES_FRAMERATE: "30,8-60"
      SELKIES_MANUAL_WIDTH: "1280"
      SELKIES_MANUAL_HEIGHT: "720"
      SELKIES_SECOND_SCREEN: "false"
      SELKIES_ENCODER: h264enc,jpeg
      SELKIES_BACKPRESSURE_QUEUE_SIZE: "2"
      SELKIES_CONGESTION_CONTROL: "true"
      SELKIES_ALLOWED_ORIGINS: https://budget.beutner.name   # verify: the app's public origin
      BROWSER_MAX: "6"
    # no ports: the app reaches 8080 (selkies), 9300 (launcher) and 9400-9405 (DevTools) on the compose network
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/weblogin/desktop/api/health >/dev/null && curl -fsS http://localhost:9300/health >/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
